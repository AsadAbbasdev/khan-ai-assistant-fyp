<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Khan A.I.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════════════
   VARIABLES & RESET
═══════════════════════════════════════════════════ */
:root {
  --bg:          #04080F;
  --bg2:         #060d18;
  --cyan:        #00FFE5;
  --cyan-dim:    rgba(0,255,229,0.15);
  --cyan-glow:   rgba(0,255,229,0.06);
  --blue:        #0A84FF;
  --text:        #C8E8F0;
  --text-dim:    #3a6070;
  --font-mono:   'Share Tech Mono', monospace;
  --font-title:  'Orbitron', monospace;
  --radius:      12px;
  --transition:  0.3s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════
   SCANLINE OVERLAY
═══════════════════════════════════════════════════ */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,255,229,0.012) 3px,
    rgba(0,255,229,0.012) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* ═══════════════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════════════ */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 48px;
  background: rgba(4,8,15,0.96);
  border-bottom: 1px solid rgba(0,255,229,0.12);
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 12px;
  z-index: 100;
  backdrop-filter: blur(12px);
}

.topbar-logo {
  font-family: var(--font-title);
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  letter-spacing: 4px;
  display: flex; align-items: center; gap: 8px;
}

.logo-dot {
  width: 8px; height: 8px;
  background: var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--cyan);
  animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.7); }
}

.topbar-spacer { flex: 1; }

.nav-btn {
  background: rgba(0,255,229,0.06);
  border: 1px solid rgba(0,255,229,0.25);
  border-radius: 6px;
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  padding: 6px 14px;
  cursor: pointer;
  transition: var(--transition);
}
.nav-btn:hover, .nav-btn.active {
  background: rgba(0,255,229,0.16);
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(0,255,229,0.2);
}

/* ═══════════════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════════════ */
.screen {
  position: fixed; inset: 0;
  padding-top: 48px;
  display: flex; flex-direction: column;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.screen.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
}

/* ═══════════════════════════════════════════════════
   INTRO SCREEN
═══════════════════════════════════════════════════ */
#intro-screen {
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
}

.gif-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 0 0 auto;
  padding: 10px 0 0;
}

.gif-wrap img {
  width: min(680px, 92vw);
  height: auto;
  display: block;
  background: transparent;
  border: none;
  filter: drop-shadow(0 0 30px rgba(0,180,255,0.25));
}

.terminal-wrap {
  width: 100%;
  max-width: 900px;
  padding: 0 40px;
  margin: 0 auto;
  flex: 1;
}

#terminal-text {
  width: 100%;
  height: 100%;
  min-height: 160px;
  background: rgba(2, 8, 20, 0.80);
  border: none;
  border-left: 2px solid rgba(0,255,229,0.35);
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: clamp(13px, 1.8vw, 17px);
  font-weight: bold;
  line-height: 1.7;
  letter-spacing: 0.5px;
  padding: 18px 24px;
  white-space: pre-wrap;
  overflow-y: auto;
  scrollbar-width: none;
}

#terminal-text::-webkit-scrollbar { display: none; }

/* blinking cursor */
#terminal-text::after {
  content: '█';
  animation: blink 0.8s step-end infinite;
  color: var(--cyan);
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.intro-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 40px 16px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

#status-label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: bold;
  color: var(--cyan);
  letter-spacing: 4px;
  opacity: 0.85;
}

/* ═══════════════════════════════════════════════════
   MIC BUTTON
═══════════════════════════════════════════════════ */
.mic-btn {
  width: 58px; height: 58px;
  border-radius: 50%;
  background: rgba(0,255,229,0.08);
  border: 1.5px solid var(--cyan);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}
.mic-btn:hover { background: rgba(0,255,229,0.18); box-shadow: 0 0 16px rgba(0,255,229,0.3); }
.mic-btn.active {
  background: rgba(0,255,229,0.22);
  box-shadow: 0 0 24px rgba(0,255,229,0.5);
  animation: mic-pulse 1.5s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%,100% { box-shadow: 0 0 16px rgba(0,255,229,0.4); }
  50%      { box-shadow: 0 0 32px rgba(0,255,229,0.7); }
}

.mic-btn svg { width: 24px; height: 24px; fill: var(--cyan); }

/* ═══════════════════════════════════════════════════
   MAIN SCREEN (GIF + CHAT)
═══════════════════════════════════════════════════ */
#main-screen {
  flex-direction: row;
  gap: 14px;
  padding: 62px 16px 16px;
  overflow: hidden;
}

/* ── Left panel: GIF ── */
.left-panel {
  flex: 0 0 420px;
  display: flex;
  flex-direction: column;
  background: rgba(0,15,25,0.65);
  border: 1px solid rgba(0,255,229,0.10);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}

.left-gif {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 10px;
}

.left-gif img {
  width: 100%;
  max-width: 380px;
  height: auto;
  filter: drop-shadow(0 0 20px rgba(0,160,255,0.3));
}

.left-status {
  background: rgba(0,255,229,0.04);
  border-top: 1px solid rgba(0,255,229,0.10);
  padding: 10px 16px;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--cyan);
  text-align: center;
}

.left-mic-row {
  display: flex; justify-content: center;
  padding: 10px 0 14px;
}

/* ── Corner brackets ── */
.corner-frame {
  position: absolute; inset: 0;
  pointer-events: none;
}
.corner-frame::before, .corner-frame::after,
.corner-frame .c3, .corner-frame .c4 {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  border-color: rgba(0,255,229,0.45);
  border-style: solid;
}
.corner-frame::before { top:0; left:0; border-width: 2px 0 0 2px; }
.corner-frame::after  { top:0; right:0; border-width: 2px 2px 0 0; }
.corner-frame .c3 { bottom:0; left:0; border-width: 0 0 2px 2px; }
.corner-frame .c4 { bottom:0; right:0; border-width: 0 2px 2px 0; }

/* ── Right panel: Chat ── */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: rgba(0,15,25,0.65);
  border: 1px solid rgba(0,255,229,0.10);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  min-width: 0;
}

.chat-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px 10px;
  border-bottom: 1px solid rgba(0,255,229,0.08);
}

.chat-header-dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-r { background: #ff4455; }
.dot-y { background: #ffd700; }
.dot-g { background: #00ff88; }

.chat-header-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--cyan);
  opacity: 0.8;
}

#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,255,229,0.2) transparent;
}
#chat-messages::-webkit-scrollbar { width: 4px; }
#chat-messages::-webkit-scrollbar-thumb { background: rgba(0,255,229,0.2); border-radius: 2px; }

.msg {
  display: flex;
  flex-direction: column;
  gap: 4px;
  animation: msg-in 0.3s ease;
}
@keyframes msg-in {
  from { opacity:0; transform: translateY(8px); }
  to   { opacity:1; transform: translateY(0); }
}

.msg-label {
  font-size: 10px;
  letter-spacing: 2px;
  opacity: 0.5;
}

.msg-bubble {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: clamp(12px, 1.5vw, 14px);
  line-height: 1.65;
  max-width: 90%;
  white-space: pre-wrap;
}

.msg.user .msg-label { color: #0A84FF; align-self: flex-end; }
.msg.user .msg-bubble {
  background: rgba(10,132,255,0.10);
  border: 1px solid rgba(10,132,255,0.25);
  color: #a8d4ff;
  align-self: flex-end;
}

.msg.ai .msg-label { color: var(--cyan); }
.msg.ai .msg-bubble {
  background: rgba(0,255,229,0.05);
  border: 1px solid rgba(0,255,229,0.15);
  color: var(--text);
}

/* streaming cursor */
.streaming::after {
  content: '▌';
  color: var(--cyan);
  animation: blink 0.6s step-end infinite;
}

/* ── Input bar ── */
.input-bar {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 14px 12px;
  background: rgba(0,255,229,0.03);
  border-top: 1px solid rgba(0,255,229,0.08);
}

#msg-input {
  flex: 1;
  background: rgba(0,255,229,0.06);
  border: 1px solid rgba(0,255,229,0.20);
  border-radius: 7px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 9px 14px;
  outline: none;
  transition: var(--transition);
}
#msg-input::placeholder { color: var(--text-dim); }
#msg-input:focus {
  border-color: rgba(0,255,229,0.55);
  background: rgba(0,255,229,0.09);
}

.send-btn {
  background: rgba(0,255,229,0.10);
  border: 1px solid rgba(0,255,229,0.35);
  border-radius: 7px;
  color: var(--cyan);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  padding: 9px 16px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
}
.send-btn:hover {
  background: rgba(0,255,229,0.22);
  box-shadow: 0 0 12px rgba(0,255,229,0.25);
}

.input-mic {
  flex-shrink: 0;
}
.input-mic .mic-btn { width: 40px; height: 40px; }
.input-mic .mic-btn svg { width: 18px; height: 18px; }

/* ── Image grid ── */
.img-bubble { padding: 12px 14px !important; }

.img-prompt {
  font-size: 11px;
  color: var(--cyan);
  letter-spacing: 2px;
  margin-bottom: 10px;
  opacity: 0.7;
}

.img-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.img-card {
  display: flex;
  flex-direction: column;
  gap: 5px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(0,255,229,0.15);
}

.img-card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  display: block;
}

.img-dl {
  background: rgba(0,255,229,0.08);
  color: var(--cyan);
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
  padding: 5px;
  text-decoration: none;
  transition: var(--transition);
}
.img-dl:hover { background: rgba(0,255,229,0.20); }

@media (max-width: 480px) {
  .img-grid { grid-template-columns: 1fr; }
}

/* ═══════════════════════════════════════════════════
   MOBILE RESPONSIVE
═══════════════════════════════════════════════════ */
@media (max-width: 768px) {
  #main-screen {
    flex-direction: column;
    padding: 58px 10px 10px;
    gap: 10px;
  }

  .left-panel {
    flex: 0 0 auto;
    flex-direction: row;
    align-items: center;
    padding: 10px;
    gap: 10px;
    border-radius: 10px;
  }

  .left-gif {
    flex: 0 0 100px;
    padding: 0;
  }
  .left-gif img { max-width: 100px; }

  .left-status {
    flex: 1;
    border-top: none;
    border-left: 1px solid rgba(0,255,229,0.10);
    text-align: left;
    padding: 0 12px;
    font-size: 10px;
    letter-spacing: 2px;
  }

  .left-mic-row { padding: 0 10px 0 0; }

  .right-panel { flex: 1; min-height: 0; }

  .terminal-wrap { padding: 0 16px; }
  .intro-bottom  { padding: 8px 16px 12px; }

  .gif-wrap img { width: 95vw; }

  #terminal-text { font-size: 13px; }

  .topbar-logo { font-size: 11px; letter-spacing: 3px; }
  .nav-btn { font-size: 10px; padding: 5px 10px; }
}

@media (max-width: 400px) {
  .left-gif { flex: 0 0 80px; }
  .left-gif img { max-width: 80px; }
  .send-btn { padding: 9px 10px; font-size: 10px; }
}

/* ═══════════════════════════════════════════════════
   SCROLLBAR (desktop)
═══════════════════════════════════════════════════ */
* { scrollbar-width: thin; scrollbar-color: rgba(0,255,229,0.15) transparent; }
</style>
</head>

<body>

<!-- ══ TOP BAR ════════════════════════════════════════════ -->
<div id="topbar">
  <div class="topbar-logo">
    <div class="logo-dot"></div>
    ◈ &nbsp;KHAN A.I.
  </div>
  <div class="topbar-spacer"></div>
  <button class="nav-btn active" id="btn-home" onclick="showScreen('intro')">⌂ HOME</button>
  <button class="nav-btn"        id="btn-chat" onclick="showScreen('main')">⌨ CHAT</button>
</div>

<!-- ══ INTRO SCREEN ══════════════════════════════════════ -->
<div class="screen" id="intro-screen">
  <div class="gif-wrap">
    <img src="/static/Jarvis.gif" alt="Khan AI" id="intro-gif"
         onerror="this.style.display='none'"/>
  </div>

  <div class="terminal-wrap">
    <div id="terminal-text"></div>
  </div>

  <div class="intro-bottom">
    <span id="status-label">● INITIALIZING...</span>
    <div class="mic-btn" id="intro-mic" onclick="toggleMic(this)" title="Toggle microphone">
      <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8 8 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
    </div>
  </div>
</div>

<!-- ══ MAIN SCREEN ════════════════════════════════════════ -->
<div class="screen hidden" id="main-screen">

  <!-- Left: GIF + mic -->
  <div class="left-panel">
    <div class="corner-frame"><span class="c3"></span><span class="c4"></span></div>
    <div class="left-gif">
      <img src="/static/Jarvis.gif" alt="Khan AI"
           onerror="this.style.display='none'"/>
    </div>
    <div class="left-status" id="main-status">● LISTENING...</div>
    <div class="left-mic-row">
      <div class="mic-btn" id="main-mic" onclick="toggleMic(this)" title="Toggle microphone">
        <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8 8 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
      </div>
    </div>
  </div>

  <!-- Right: Chat -->
  <div class="right-panel">
    <div class="corner-frame"><span class="c3"></span><span class="c4"></span></div>

    <div class="chat-header">
      <div class="chat-header-dots">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
      </div>
      <div class="chat-header-title">KHAN A.I. // CHAT TERMINAL</div>
    </div>

    <div id="chat-messages"></div>

    <div class="input-bar">
      <input id="msg-input" type="text" placeholder="Enter command..."
             autocomplete="off" autocorrect="off" spellcheck="false"
             onkeydown="if(event.key==='Enter') sendMessage()"/>
      <button class="send-btn" onclick="sendMessage()">SEND ▶</button>
      <div class="input-mic">
        <div class="mic-btn" id="chat-mic" onclick="toggleVoiceInput()" title="Voice input">
          <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8 8 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/></svg>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════ */
const WS_PROTOCOL = location.protocol === 'https:' ? 'wss:' : 'ws:';
const WS_URL      = `${WS_PROTOCOL}//${location.host}/ws/chat`;
const INTRO_TEXT  = `[ SYSTEM BOOT... OK ]
[ NEURAL NETWORK... ONLINE ]
[ VOICE MODULE... ACTIVE ]

Khan A.I. System is initialized.

First of all, allow me to introduce myself —
I am KHAN, a Virtual Artificial Intelligence,
and I am here to assist you with a variety of tasks,
24 hours a day, 7 days a week.

Your command is my priority. How may I serve you today?`;

/* ═══════════════════════════════════════════════════
   SCREEN MANAGEMENT
═══════════════════════════════════════════════════ */
function showScreen(name) {
  document.getElementById('intro-screen').classList.toggle('hidden', name !== 'intro');
  document.getElementById('main-screen').classList.toggle('hidden',  name !== 'main');
  document.getElementById('btn-home').classList.toggle('active', name === 'intro');
  document.getElementById('btn-chat').classList.toggle('active', name === 'main');
  if (name === 'main') connectWS();
}

/* ═══════════════════════════════════════════════════
   TYPEWRITER INTRO
═══════════════════════════════════════════════════ */
const termEl    = document.getElementById('terminal-text');
const statusEl  = document.getElementById('status-label');

function typewriter(text, delay = 28) {
  return new Promise(resolve => {
    let i = 0;
    const interval = setInterval(() => {
      if (i < text.length) {
        termEl.textContent += text[i++];
        termEl.scrollTop = termEl.scrollHeight;
      } else {
        clearInterval(interval);
        resolve();
      }
    }, delay);
  });
}

async function runIntro() {
  statusEl.textContent = '● INITIALIZING...';
  await sleep(500);

  // Voice already triggered by click overlay
  await typewriter(INTRO_TEXT, 28);
  statusEl.textContent = '● SYSTEM READY';

  await sleep(2000);
  showScreen('main');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ═══════════════════════════════════════════════════
   WEB SPEECH API — TTS
═══════════════════════════════════════════════════ */

// Wait until voices are loaded, then return best male voice
function getBestVoice() {
  const voices = speechSynthesis.getVoices();
  return (
    voices.find(v => v.name.toLowerCase().includes('david'))   ||
    voices.find(v => v.name.toLowerCase().includes('mark'))    ||
    voices.find(v => v.name.toLowerCase().includes('zira'))    ||
    voices.find(v => v.lang === 'en-US' && v.localService)     ||
    voices.find(v => v.lang === 'en-US')                       ||
    voices.find(v => v.lang.startsWith('en'))                  ||
    null
  );
}

function _speak(text, rate=1.65, pitch=1.0) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt    = new SpeechSynthesisUtterance(text);
  utt.rate     = rate;    // 1.25 ≈ 190 wpm
  utt.pitch    = pitch;   // 1.0 = natural, no gonj
  utt.volume   = 1.0;
  const voice  = getBestVoice();
  if (voice) utt.voice = voice;
  speechSynthesis.speak(utt);
}

function speakIntro() {
  const clean = `Khan A.I. System is initialized.
First of all, allow me to introduce myself.
I am KHAN, a Virtual Artificial Intelligence,
and I am here to assist you with a variety of tasks,
24 hours a day, 7 days a week.
Your command is my priority. How may I serve you today?`;

  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.addEventListener('voiceschanged', () => {
      _speak(clean, 1.65, 1.0);
    }, { once: true });
  } else {
    _speak(clean, 1.65, 1.0);
  }
}

function speakText(text) {
  _speak(text, 1.65, 1.0);
}

/* ═══════════════════════════════════════════════════
   VOICE INPUT (Speech-to-Text)
═══════════════════════════════════════════════════ */
let recognition = null;
let micActive   = false;

function toggleVoiceInput() {
  const btn = document.getElementById('chat-mic');
  if (!micActive) {
    startVoiceInput(btn);
  } else {
    stopVoiceInput(btn);
  }
}

function startVoiceInput(btn) {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Speech recognition not supported in this browser. Use Chrome.');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('msg-input').value = transcript;
    sendMessage();
  };
  recognition.onerror  = () => stopVoiceInput(btn);
  recognition.onend    = () => stopVoiceInput(btn);
  recognition.start();
  micActive = true;
  btn.classList.add('active');
}

function stopVoiceInput(btn) {
  if (recognition) { recognition.stop(); recognition = null; }
  micActive = false;
  btn.classList.remove('active');
}

function toggleMic(btn) {
  btn.classList.toggle('active');
}

/* ═══════════════════════════════════════════════════
   WEBSOCKET CHAT
═══════════════════════════════════════════════════ */
let ws            = null;
let currentAiMsg  = null;
let currentBubble = null;
let fullAnswer    = '';

function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setMainStatus('● CONNECTED');
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'status') {
      setMainStatus('● ' + msg.text.toUpperCase());
    }

    else if (msg.type === 'chunk') {
      if (!currentAiMsg) {
        currentAiMsg  = createMsg('ai', '');
        currentBubble = currentAiMsg.querySelector('.msg-bubble');
        currentBubble.classList.add('streaming');
        fullAnswer = '';
      }
      fullAnswer += msg.text;
      currentBubble.textContent = fullAnswer;
      scrollChat();

      if (msg.done) {
        currentBubble.classList.remove('streaming');
        speakText(msg.full || fullAnswer);
        currentAiMsg  = null;
        currentBubble = null;
        fullAnswer    = '';
      }
    }

    // ── Browser automation: open URL in new tab ──
    else if (msg.type === 'browser_action') {
      if (msg.action === 'open_url' && msg.url) {
        window.open(msg.url, '_blank');
      }
    }

    // ── Image generation results ──
    else if (msg.type === 'images') {
      appendImages(msg.urls, msg.prompt);
    }

    else if (msg.type === 'error') {
      appendMsg('ai', '⚠ ' + msg.text);
    }
  };

  ws.onclose = () => {
    setMainStatus('● DISCONNECTED — retrying...');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    setMainStatus('● CONNECTION ERROR');
  };
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';

  appendMsg('user', text);

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    connectWS();
    setTimeout(() => sendToWS(text), 600);
  } else {
    sendToWS(text);
  }
}

function sendToWS(text) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ query: text }));
  }
}

/* ═══════════════════════════════════════════════════
   CHAT UI HELPERS
═══════════════════════════════════════════════════ */
function createMsg(role, text) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <span class="msg-label">${role === 'user' ? '▶ YOU' : '◈ KHAN A.I.'}</span>
    <div class="msg-bubble">${text}</div>
  `;
  container.appendChild(div);
  scrollChat();
  return div;
}

function appendMsg(role, text) {
  createMsg(role, text);
}

function appendImages(urls, prompt) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `
    <span class="msg-label">◈ KHAN A.I.</span>
    <div class="msg-bubble img-bubble">
      <div class="img-prompt">Generated: "${prompt}"</div>
      <div class="img-grid">
        ${urls.map((url, i) => `
          <div class="img-card">
            <img src="${url}" alt="Generated ${i+1}"
                 onerror="this.parentElement.style.display='none'"/>
            <a href="${url}" download="khan_ai_${i+1}.jpg" class="img-dl">⬇ Download</a>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  container.appendChild(div);
  scrollChat();
}

function scrollChat() {
  const c = document.getElementById('chat-messages');
  c.scrollTop = c.scrollHeight;
}

function setMainStatus(text) {
  const el = document.getElementById('main-status');
  if (el) el.textContent = text;
}
